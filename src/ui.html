<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Bots</title>
<style>
  :root {
    --bg: #08090b; --panel: #0e1015; --card: #13161c; --card-2: #1b1f27;
    --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.14);
    --text: #f2f4f8; --muted: #8b93a3; --faint: #5a6172;
    --accent: #6d5efc; --accent-2: #8b7cff; --accent-soft: rgba(109,94,252,.16);
    --glow: 0 0 0 1px rgba(109,94,252,.35), 0 8px 24px -6px rgba(109,94,252,.45);
    --ok: #22d3a5; --warn: #ffb224; --danger: #ff5c5c;
    --r: 14px; --r-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  /* App shell: the window never scrolls, only the content area does. */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    display: flex; flex-direction: column;
    background:
      radial-gradient(1100px 620px at 88% -12%, rgba(109,94,252,.16), transparent 62%),
      radial-gradient(760px 520px at 2% 108%, rgba(34,211,165,.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input { font: inherit; color: inherit; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* ---------- header ---------- */
  header {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding: 0 22px; height: 60px;
    background: rgba(8,9,11,.72); backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 15px; letter-spacing: -.2px; }
  .brand .dot {
    width: 24px; height: 24px; border-radius: 8px;
    background: linear-gradient(140deg, #8b7cff, #6d5efc 45%, #22d3a5);
    box-shadow: 0 0 18px -2px rgba(109,94,252,.75);
  }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--card-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap;
  }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .pill.-joining::before, .pill.-stopping::before, .pill.-leaving::before
    { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
  .pill.-running::before, .pill.-in-call::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .pill.-error::before { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .35; } }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
    border-radius: var(--r-sm); background: var(--card-2); border: 1px solid var(--line);
    font-size: 12.5px; color: var(--muted); white-space: nowrap;
  }
  .chip b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip.-warn b { color: var(--warn); }
  .chip.-danger b { color: var(--danger); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 34px; padding: 0 14px; border-radius: var(--r-sm);
    background: var(--card-2); border: 1px solid var(--line-2);
    font-weight: 600; font-size: 13px; transition: all .15s ease;
  }
  .btn:hover { background: #202636; border-color: rgba(255,255,255,.22); }
  .btn.-accent {
    background: linear-gradient(135deg, #7d6dff, #6d5efc 55%, #5b4bf0);
    border-color: transparent; color: #fff; box-shadow: var(--glow);
  }
  .btn.-accent:hover { background: linear-gradient(135deg, #8f81ff, #7a6bff); }
  .btn.-danger { color: var(--danger); }
  .btn.-danger:hover { background: rgba(255,92,92,.12); border-color: rgba(255,92,92,.4); }
  .btn:disabled { opacity: .45; pointer-events: none; }

  main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 22px 20px 32px; }
  .wrap { max-width: 1240px; margin: 0 auto; }

  /* ---------- control bar (always visible) ---------- */
  .bar {
    display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 60%), var(--panel);
    border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 20px;
  }
  /* A wrapping flex line breaks on BASIS, before shrinking is considered, so
     the link field's basis is what decides whether Send bots keeps its place
     on the row. Kept small deliberately: the field still grows into whatever
     is left over, so a wide window gives it plenty and a narrow one gives the
     bar a single row instead of dropping the button onto a second. */
  .bar .grow { flex: 1 1 240px; min-width: 210px; }
  .lbl {
    display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700;
    color: var(--muted); margin-bottom: 9px; letter-spacing: .9px; text-transform: uppercase;
  }
  .bar input[type=text], .bar input[type=number] {
    width: 100%; height: 42px; padding: 0 14px; border-radius: var(--r-sm);
    background: var(--card); border: 1px solid var(--line-2); outline: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    transition: border-color .15s, box-shadow .15s;
  }
  .bar input::placeholder { color: var(--faint); }
  .bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .bar input:disabled { opacity: .6; }
  .bar .bot-label { width: 150px; flex: none; }
  .bar .count { width: 92px; flex: none; }
  .bar .devices { flex: none; }
  .toggles { display: flex; gap: 8px; }
  .tgl {
    height: 42px; min-width: 104px; padding: 0 14px; border-radius: var(--r-sm);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line-2); color: var(--muted);
    font-weight: 600; font-size: 13px; transition: all .15s ease;
  }
  .tgl:hover { border-color: rgba(255,255,255,.22); }
  .tgl .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .tgl.-on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  .tgl.-on .pip { background: var(--ok); }
  .tgl:disabled { opacity: .6; }
  .bar .go { height: 42px; padding: 0 22px; font-size: 14px; }

  /* Codec pickers: a button trigger and an app-drawn menu, because the
     browser's native select popup places and sizes itself however the OS
     pleases. The menu is position:fixed so the card's overflow cannot clip it. */
  .codec {
    height: 30px; padding: 0 22px 0 9px; border-radius: var(--r-sm);
    background: var(--card-2) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='8' height='5'%3E%3Cpath d='M1 1l3 3 3-3' stroke='%238b93a3' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 8px center;
    border: 1px solid var(--line-2); color: var(--text);
    font: inherit; font-size: 11.5px; font-weight: 600; text-align: left;
    appearance: none; -webkit-appearance: none; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: border-color .15s, box-shadow .15s;
  }
  .codec:hover { border-color: rgba(255,255,255,.22); }
  .codec:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .codec.-open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  /* A forced codec wears the accent: the picker shows the codec in effect
     either way, so the border is what says "pinned by hand, not the call's
     own choice". */
  .codec.-forced { border-color: var(--accent); }
  .codec:disabled { opacity: .5; pointer-events: none; }
  .cmenu {
    position: fixed; z-index: 60; padding: 4px; min-width: 96px;
    max-height: 60vh; overflow-y: auto;
    background: var(--card-2); border: 1px solid var(--line-2); border-radius: var(--r-sm);
    box-shadow: 0 14px 36px -10px rgba(0,0,0,.65);
    display: flex; flex-direction: column; gap: 1px;
    animation: menuin .12s ease;
  }
  @keyframes menuin { from { opacity: 0; transform: translateY(-3px); } }
  .crow {
    display: flex; align-items: center; gap: 7px; padding: 5px 12px 5px 7px;
    border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--text);
    text-align: left; white-space: nowrap;
  }
  .crow:hover { background: var(--accent-soft); }
  .crow.-on { color: var(--accent-2); }
  .crow .tick { width: 12px; flex: none; font-size: 10px; }

  .allbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .capset { display: inline-flex; align-items: center; gap: 8px; }
  .allbar .lead { font-size: 12px; font-weight: 650; color: var(--faint); text-transform: uppercase; letter-spacing: .4px; }
  .allbar .btn { height: 30px; padding: 0 11px; font-size: 12.5px; }

  /* The codecs the NEXT send arrives with, standing with the devices they
     belong to: what a bot joins with is one decision, and the camera it
     arrives on is part of it. Out of the flow until asked for, so the bar
     stays a single row — and sized to the toggles when it is asked for, so
     the row is one weight of control rather than two. The trigger wears the
     accent while something is pinned: a hidden choice must still be visible
     from the outside. text-transform and letter-spacing are inherited back
     because the UA stylesheet resets both on a button. */
  .lnk { color: var(--faint); text-transform: inherit; letter-spacing: inherit; transition: color .15s; }
  .lnk:hover { color: var(--muted); }
  .lnk.-on { color: var(--accent-2); }
  .jcodecs { display: flex; align-items: flex-end; gap: 14px; flex: none; }
  .jcodecs .codec { height: 42px; min-width: 96px; padding: 0 26px 0 12px; font-size: 12.5px; }

  /* ---------- one group per send ---------- */
  .batch { margin-bottom: 22px; }
  .bhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bhead .nm {
    font-size: 11px; font-weight: 700; letter-spacing: .9px;
    text-transform: uppercase; color: var(--muted);
  }
  .bhead .sub { font-size: 12px; color: var(--faint); }
  .bhead .btn { height: 28px; padding: 0 10px; font-size: 12px; }

  .empty {
    display: grid; place-items: center; gap: 10px; padding: 60px 20px; text-align: center;
    border: 1px dashed var(--line-2); border-radius: var(--r); color: var(--muted);
  }
  .empty b { color: var(--text); font-size: 15px; font-weight: 650; }

  /* ---------- bot cards ---------- */
  /* align-items: start — an expanded stream monitor must not stretch its row */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; align-items: start; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    overflow: hidden; position: relative; transition: border-color .18s, transform .18s;
  }
  .card:hover, .card.menu-open { border-color: var(--line-2); transform: translateY(-2px); }
  .card .strip { height: 3px; }
  .thumb { position: relative; aspect-ratio: 16/9; background: #0d1016; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .skeleton {
    position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-size: 12px;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.05) 50%, transparent 70%) #0d1016;
    background-size: 220% 100%; animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer { to { background-position: -120% 0; } }
  .thumb .pill { position: absolute; left: 10px; bottom: 10px; background: rgba(10,12,17,.78); backdrop-filter: blur(6px); }
  .cbody { padding: 12px 14px 14px; }
  .who { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ava { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; flex: none; }
  .who .nm { font-weight: 650; font-size: 14px; }
  .who .sub { color: var(--faint); font-size: 11.5px; }
  .who .gap { flex: 1; }
  .controls { display: flex; align-items: center; gap: 6px; }
  .ibtn {
    width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--card-2); color: var(--muted);
    transition: all .13s; position: relative;
  }
  .ibtn:hover { color: var(--text); border-color: var(--line-2); background: #202636; }
  .ibtn.-off { color: var(--danger); border-color: rgba(255,92,92,.4); background: rgba(255,92,92,.10); }
  .ibtn.-live { color: var(--accent-2); border-color: rgba(109,94,252,.5); background: var(--accent-soft); }
  .ibtn.-req { color: var(--warn); border-color: rgba(255,178,36,.4); background: rgba(255,178,36,.08); }
  .ibtn:disabled { opacity: .35; pointer-events: none; }
  .ibtn.busy { pointer-events: none; }
  .ibtn.busy svg { opacity: 0; }
  .ibtn.busy::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.2); border-top-color: var(--text);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .controls .gap { flex: 1; }
  .err { margin-top: 10px; color: var(--danger); font-size: 12px; display: none; }
  .card.has-error .err { display: block; }
  .err .lnk { display: block; margin-top: 6px; }
  /* In the call, but not doing what it was sent to do — a launch codec that
     turned out to send nothing. Not an error: the bot works, on the call's own
     codec instead. Amber, so it reads as "look at this", not "this is broken". */
  .cnote { margin-top: 10px; color: var(--warn); font-size: 12px; }

  /* ---------- pinned bots ---------- */
  /* A pin is a view preference, not something the bot does, so its button
     stays quieter than the media controls under it — until it is on. */
  .ibtn.-pin { width: 28px; height: 28px; border-color: transparent; background: none; }
  .ibtn.-pin svg { width: 14px; height: 14px; }
  .ibtn.-pin:hover { background: var(--card-2); }
  .ibtn.-pin.-on { color: var(--accent-2); border-color: rgba(109,94,252,.5); background: var(--accent-soft); }
  /* Declared after .card:hover so a pinned card keeps its mark under the
     pointer — it is the same card the section above is made of. */
  .card.-pinned { border-color: rgba(109,94,252,.4); }
  #pinned { margin-bottom: 22px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  #pinned .bhead .nm { color: var(--accent-2); }
  .bnote { font-size: 12px; color: var(--faint); }

  /* ---------- per-bot stream monitor ---------- */
  .rtcbar {
    display: flex; align-items: center; gap: 10px; margin-top: 10px;
    font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .rtcbar b { color: var(--text); font-weight: 600; }
  .qdot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .qdot.-ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .qdot.-warn { background: var(--warn); }
  .qdot.-danger { background: var(--danger); }
  .rtcpanel { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .card.rtc-open .rtcpanel { display: block; }
  .codecbar { display: flex; gap: 6px; margin-bottom: 8px; }
  .codecbar .cgrp { flex: 1; min-width: 0; }
  .codecbar .codec { width: 100%; }
  /* The role and the codec REALLY going out live in a tiny caption above the
     select, so the dropdown rows can be nothing but clean codec names. */
  .ck {
    display: block; margin-bottom: 3px;
    font-size: 9.5px; font-weight: 700; letter-spacing: .6px;
    text-transform: uppercase; color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .allbar .ck { display: inline; margin: 0 0 0 6px; }
  .allbar .codec { min-width: 104px; }
  /* The path ICE settled on. A relayed call and a direct one behave nothing
     alike, and nothing else in the panel says which one a bot got. */
  .rpath {
    margin-bottom: 8px; text-align: right;
    font-size: 11.5px; font-weight: 600; color: var(--text);
  }
  .rtcpanel .lbl { margin: 10px 0 6px; }
  .srow {
    display: flex; align-items: center; gap: 8px; min-width: 0; margin-bottom: 4px; padding: 5px 8px;
    border-radius: 8px; background: var(--card-2); border: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .srow svg { width: 13px; height: 13px; flex: none; }
  .srow .nm { flex: none; max-width: 40%; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .meta { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .meta b { color: var(--text); font-weight: 600; }
  .srow .lvl { width: 30px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; flex: none; }
  .srow .lvl i { display: block; height: 100%; background: var(--ok); }
  .srow .rate { flex: none; color: var(--text); font-weight: 600; }
  .rwarn { color: var(--warn); font-size: 11px; margin-top: 6px; }
  .rmsg { color: var(--faint); font-size: 12px; padding: 6px 0; }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; top: 70px; right: 18px; z-index: 40; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    display: flex; align-items: center; gap: 9px; background: var(--card-2);
    border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 14px;
    font-size: 13px; max-width: 380px; animation: slidein .18s ease;
  }
  .toast.-ok { border-color: rgba(34,211,165,.5); }
  .toast.-err { border-color: rgba(255,92,92,.5); }
  .toast.-warn { border-color: rgba(255,178,36,.5); }
  @keyframes slidein { from { transform: translateX(12px); opacity: 0; } }

  #connBanner {
    display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: var(--danger); color: #16060a; font-weight: 700; font-size: 12.5px;
    text-align: center; padding: 4px;
  }
  body.disconnected #connBanner { display: block; }

  /* ---------- Google Meet (a rare platform: nothing shows until it is one) ---------- */
  /* flex-basis: 100% forces its own line in the wrapping bar above, so the
     strip sits under the controls instead of competing with them for width. */
  .meetbar {
    display: flex; align-items: center; gap: 8px; flex: 0 0 100%;
    margin: 2px 0 0; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--faint);
  }
  .meetbar b { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .meetbar .lead { font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .meetbar.-short b { color: var(--warn); }
  .meetbar .spacer { flex: 1; }
  .meetbar .btn { height: 27px; padding: 0 10px; font-size: 12px; }

</style>
</head>
<body>
<div id="connBanner">disconnected — retrying…</div>

<header>
  <div class="brand"><div class="dot"></div>Call Bots</div>
  <span id="statusPill" class="pill">idle</span>
  <div class="spacer"></div>
  <span id="sysNet" class="chip" hidden title="This computer's network throughput">↓ <b>–</b> ↑ <b>–</b></span>
  <span id="sysCpu" class="chip" hidden title="This computer's CPU load">CPU <b>–</b></span>
  <span id="sysMem" class="chip" hidden title="This computer's memory: in use, and what is still free for more bots">RAM <b>–</b> · <b>–</b> free</span>
  <button id="stopBtn" class="btn -danger" hidden>Stop</button>
</header>

<main>
  <div class="wrap">
    <div class="bar">
      <div class="grow">
        <div class="lbl">Call link</div>
        <input type="text" id="link" placeholder="paste call link" spellcheck="false">
      </div>
      <div class="bot-label" id="labelField">
        <div class="lbl">Label</div>
        <input type="text" id="botLabel" maxlength="40" spellcheck="false">
      </div>
      <div class="count">
        <div class="lbl">Bots</div>
        <input type="number" id="count" min="1" max="50" value="2">
      </div>
      <div class="devices">
        <div class="lbl">Join with
          <button type="button" id="codecToggle" class="lnk" data-capability="codecs" aria-expanded="false"
            title="Send codecs the bots arrive with">Codecs</button>
        </div>
        <div class="toggles">
          <button type="button" id="camToggle" class="tgl -on" aria-pressed="true">
            <span class="pip"></span><span>Camera on</span></button>
          <button type="button" id="micToggle" class="tgl -on" aria-pressed="true">
            <span class="pip"></span><span>Mic on</span></button>
        </div>
      </div>

      <div class="jcodecs" id="joinCodecs" data-capability="codecs" hidden>
        <div class="cgrp">
          <div class="lbl">Cam</div>
          <button type="button" class="codec" data-join-codec="video"
            title="Camera send codec the bots arrive with">Auto</button>
        </div>
        <div class="cgrp">
          <div class="lbl">Screen</div>
          <button type="button" class="codec" data-join-codec="screen"
            title="Screenshare send codec the bots arrive with">Auto</button>
        </div>
      </div>
      <button id="goBtn" class="btn -accent go">Send bots</button>
      <!-- Meet is rare, so it earns exactly one row, and only once a Meet link
           is in the field: what a guest bot needs on this machine, or that it
           needs nothing. -->
      <div class="meetbar" id="meetBar" hidden>
        <span class="lead">Guests</span>
        <span id="meetBarText"></span>
        <span class="spacer"></span>
        <button type="button" class="btn" id="windowsBtn" hidden
          title="Bot windows are hidden by default; show them to watch a bot's own view">Show windows</button>
      </div>
    </div>

    <div class="allbar" id="allbar" hidden>
      <span class="lead">All bots</span>
      <button class="btn" data-all="unmute">Unmute</button>
      <button class="btn" data-all="mute">Mute</button>
      <button class="btn" data-all="cam-on">Cameras on</button>
      <button class="btn" data-all="cam-off">Cameras off</button>
      <span class="capset" data-capability="screen">
        <button class="btn" data-all="share-on">Share screens</button>
        <button class="btn" data-all="share-off">Stop sharing</button>
      </span>
      <span class="capset" data-capability="codecs">
        <span class="ck">Cam</span>
        <button type="button" class="codec" data-all-codec="video" title="Every bot's camera send codec">Auto</button>
        <span class="ck">Screen</span>
        <button type="button" class="codec" data-all-codec="screen" title="Every bot's screenshare send codec">Auto</button>
      </span>
    </div>

    <div class="empty" id="empty">
      <b id="emptyTitle">No bots in a call yet</b>
      <span id="emptyText">Paste the invite link, choose how many bots, and send them in.</span>
    </div>

    <div id="pinned" hidden>
      <div class="bhead">
        <span class="nm">Pinned</span>
        <span class="sub"></span>
        <span class="spacer"></span>
        <button class="btn" id="unpinAll" title="Send every pinned bot back to its batch">Unpin all</button>
      </div>
      <div class="grid"></div>
    </div>

    <div id="cards"></div>
  </div>
</main>

<div id="toasts"></div>

<script>
'use strict'
const svg = (body) =>
  `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" ` +
  `stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`

const I = {
  mic: svg('<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>'),
  micOff: svg('<line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/>'),
  cam: svg('<path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>'),
  camOff: svg('<path d="M10.66 6H14a2 2 0 0 1 2 2v2.5l5.248-3.062A.5.5 0 0 1 22 7.87v8.196"/><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/><path d="m2 2 20 20"/>'),
  share: svg('<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>'),
  leave: svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>'),
  pulse: svg('<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>'),
  pin: svg('<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>'),
}

const $ = (sel, root = document) => root.querySelector(sel)
const el = (tag, cls, html) => {
  const node = document.createElement(tag)
  if (cls) node.className = cls
  if (html !== undefined) node.innerHTML = html
  return node
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/gu, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const toast = (msg, kind = '') => {
  const node = el('div', `toast ${kind}`, esc(msg))
  $('#toasts').append(node)
  setTimeout(() => { node.style.opacity = '0'; node.style.transition = 'opacity .3s'; setTimeout(() => node.remove(), 350) }, 4500)
}
const post = async (url, body) => {
  const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) })
  const data = await res.json().catch(() => ({}))
  if (!res.ok || data.ok === false) throw new Error(data.error ?? `HTTP ${res.status}`)
  return data
}

const FULL_CAPABILITIES = Object.freeze({ mic: true, camera: true, screen: true, rtc: true, codecs: true })
// What the server will say once a Meet session exists — mirrored here so the
// controls Meet cannot honour never flash into view while a link is typed.
const MEET_CAPABILITIES = Object.freeze({ mic: true, camera: true, screen: true, rtc: true, codecs: false })
const platformFromLink = () => {
  try {
    const url = new URL($('#link').value.trim())
    if (url.hostname === 'meet.google.com') return 'meet'
    if (/\/join\//u.test(url.pathname)) return 'aloqa'
  } catch { /* a partial link has no detected platform yet */ }
  return null
}
const platformId = () => {
  const platform = S.state?.session?.platform
  if (/google meet/iu.test(platform ?? '')) return 'meet'
  if (/aloqa/iu.test(platform ?? '')) return 'aloqa'
  return platformFromLink()
}
const capabilities = () =>
  S.state?.session?.capabilities ?? (platformId() === 'meet' ? MEET_CAPABILITIES : FULL_CAPABILITIES)
// What Meet needs on this machine, as the server sees it: Google Chrome, and
// macOS for the guests' driver. Assumed present until the first state lands.
const meetInfo = () => S.state?.meet ?? { chromeReady: true, macOS: true }

const S = {
  state: null, cards: new Map(), groups: new Map(), rtc: new Map(),
  errorShown: null, camOn: true, micOn: true,
  admissionNotice: null,
  pinned: new Set(),
  // undefined until the first state arrives — null is a real value here (idle).
  pinnedAt: undefined,
}

// The whole of Meet's presence in the main window: one line, only for a Meet
// link. Guests need nothing set up, so the line stays quiet unless this
// machine is missing what they run on.
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)]
const meetUnavailable = () => !meetInfo().macOS || !meetInfo().chromeReady

// One description of what the Meet empty state says. There used to be two,
// written in two places and both run on every frame, and they drifted apart the
// moment guests arrived — the later one silently won and talked about accounts
// to somebody sending guests.
const meetEmptyState = (joining) => {
  const info = meetInfo()
  if (joining) {
    return {
      title: 'Preparing Google Meet bots',
      text: 'Each bot opens a Chrome window and asks to be let in — admit them in Meet. ' +
        'The first send on this Mac also builds a private copy of Chrome (about a minute).',
    }
  }
  if (!info.macOS) {
    return {
      title: 'Google Meet bots need a Mac',
      text: 'Meet guests are real Chrome windows driven through Apple Events — run Call Bots on macOS for Meet.',
    }
  }
  if (!info.chromeReady) {
    return {
      title: 'Google Chrome is required for Meet',
      text: 'Meet guests run in a copy of Google Chrome — install it, then send again.',
    }
  }
  return {
    title: 'Ready for Google Meet',
    text: 'Bots will ask to join by name — admit them in Meet once they knock.',
  }
}

const showMeetEmptyState = (joining) => {
  const { title, text } = meetEmptyState(joining)
  $('#emptyTitle').textContent = title
  $('#emptyText').textContent = text
}

const renderMeetBar = () => {
  const bar = $('#meetBar')
  if (platformId() !== 'meet') {
    bar.hidden = true
    return
  }
  const info = meetInfo()
  bar.hidden = false
  bar.classList.toggle('-short', meetUnavailable())
  $('#meetBarText').innerHTML = !info.macOS
    ? 'need <b>macOS</b>'
    : !info.chromeReady
      ? 'need <b>Google Chrome</b> installed'
      : 'no setup — the host admits them'
  // The bots' windows exist but stay hidden, like every other bot's browser;
  // the switch is there for watching one, and only while there is one.
  const session = S.state?.session
  const live = Boolean(session) && ['joining', 'running'].includes(S.state?.status)
  const windows = $('#windowsBtn')
  windows.hidden = !live
  windows.textContent = session?.windowsVisible ? 'Hide windows' : 'Show windows'
}
$('#windowsBtn').onclick = async (event) => {
  const button = event.currentTarget
  const visible = !S.state?.session?.windowsVisible
  button.disabled = true
  try {
    await post('/api/windows', { visible })
  } catch (error) {
    toast(error.message, '-err')
  } finally {
    button.disabled = false
  }
}
/* ---------- saved label ---------- */
const LABEL_STORAGE_KEY = 'call-bots-label'
const botLabelInput = $('#botLabel')
try { botLabelInput.value = localStorage.getItem(LABEL_STORAGE_KEY) ?? '' }
catch { /* storage can be unavailable in a restricted browser */ }
botLabelInput.oninput = () => {
  try { localStorage.setItem(LABEL_STORAGE_KEY, botLabelInput.value) }
  catch { /* keep the input usable even when storage is unavailable */ }
}

const syncPlatformUi = () => {
  const id = platformId()
  const caps = capabilities()
  $('#codecToggle').hidden = !caps.codecs
  $('#allbar [data-capability="screen"]').hidden = !caps.screen
  $('#allbar [data-capability="codecs"]').hidden = !caps.codecs
  if (!caps.codecs) {
    $('#joinCodecs').hidden = true
    $('#codecToggle').setAttribute('aria-expanded', 'false')
  }
  renderMeetBar()

  const status = S.state?.status
  const busy = status === 'joining' || status === 'stopping'
  // Meet guests run in a copy of the real Google Chrome, on a Mac; Aloqa bots
  // run on the bundled Chromium.
  const browserUnavailable = S.state && (
    id === 'meet'
      ? meetUnavailable()
      : (!S.state.browserReady || S.state.browserInstalling)
  )
  $('#goBtn').disabled = Boolean(busy || browserUnavailable)
  if (id === 'meet' && (S.state?.session?.guests ?? []).length === 0) {
    showMeetEmptyState(status === 'joining')
  }
}
$('#link').oninput = syncPlatformUi
$('#count').oninput = syncPlatformUi

/* ---------- what bots join with ---------- */
// Only the state they arrive in — every bot still carries its clip and voice,
// so a camera turned on from its card afterwards publishes real footage.
const devices = [
  { key: 'camOn', el: '#camToggle', name: 'Camera' },
  { key: 'micOn', el: '#micToggle', name: 'Mic' },
]
for (const device of devices) {
  $(device.el).onclick = () => {
    S[device.key] = !S[device.key]
    const button = $(device.el)
    button.classList.toggle('-on', S[device.key])
    button.setAttribute('aria-pressed', String(S[device.key]))
    button.lastElementChild.textContent = `${device.name} ${S[device.key] ? 'on' : 'off'}`
  }
}

/* ---------- send bots (starts the session, or adds to it) ---------- */
$('#goBtn').onclick = async () => {
  const btn = $('#goBtn')
  const guests = Math.max(1, Number($('#count').value) || 1)
  const botLabel = $('#botLabel').value.trim()
  const running = S.state?.status === 'running'
  const buttonLabel = btn.textContent
  btn.disabled = true
  btn.textContent = 'Sending…'
  try {
    if (running) {
      const res = await post('/api/add', {
        guests, label: botLabel, camera: S.camOn, mic: S.micOn, ...joinCodecs(),
      })
      if (res.removed) toast('that batch was removed while it was still arriving', '-warn')
      else toast(`${res.added} bot(s) joined${res.failed ? `, ${res.failed} failed` : ''}`, res.failed ? '-warn' : '-ok')
    } else {
      await post('/api/start', {
        link: $('#link').value.trim(), guests, label: botLabel,
        camera: S.camOn, mic: S.micOn, ...joinCodecs(),
      })
    }
  } catch (error) {
    toast(error.message, '-err')
  } finally {
    btn.disabled = false
    btn.textContent = buttonLabel
    syncPlatformUi()
  }
}
$('#link').onkeydown = (event) => { if (event.key === 'Enter') $('#goBtn').click() }

/* ---------- stop ---------- */
$('#stopBtn').onclick = async () => {
  const btn = $('#stopBtn')
  btn.disabled = true
  try {
    await post('/api/stop')
  } catch (error) {
    toast(error.message, '-err')
  } finally {
    btn.disabled = false
  }
}

for (const btn of document.querySelectorAll('[data-all]')) {
  btn.onclick = async () => {
    btn.disabled = true
    try { await post('/api/action', { slug: 'all', action: btn.dataset.all }) }
    catch (error) { toast(error.message, '-err') }
    finally { btn.disabled = false }
  }
}

/* ---------- send codecs ---------- */
const CODEC_WORD = { audio: 'microphone', video: 'camera', screen: 'screenshare' }
// The fixed order every picker lists codecs in.
const CODEC_RANK = { vp9: 0, vp8: 1, av1: 2, h265: 3, h264: 4, opus: 0, g722: 1, pcmu: 2, pcma: 3 }
const sortCodecs = (names) =>
  [...names].sort((a, b) => (CODEC_RANK[a] ?? 99) - (CODEC_RANK[b] ?? 99) || a.localeCompare(b))
// What the fleet-wide pickers offer; a bot's own picker narrows further to
// what its call negotiates.
const CODEC_LISTS = {
  audio: sortCodecs(['opus']),
  video: sortCodecs(['vp8', 'vp9', 'h264', 'av1', 'h265']),
  screen: sortCodecs(['vp8', 'vp9', 'h264', 'av1', 'h265']),
}

// One app-drawn menu at a time, position:fixed and flipped when the space
// below runs out — the native select popup goes wherever the OS pleases,
// which is exactly the discomfort this replaces.
const codecMenu = { host: null, anchor: null, card: null }
const closeCodecMenu = () => {
  codecMenu.host?.remove()
  codecMenu.anchor?.classList.remove('-open')
  codecMenu.card?.classList.remove('menu-open')
  codecMenu.host = null
  codecMenu.anchor = null
  codecMenu.card = null
}
const placeCodecMenu = () => {
  if (!codecMenu.host || !codecMenu.anchor) return
  const at = codecMenu.anchor.getBoundingClientRect()
  // The anchor scrolled out of sight — a floating menu with no visible owner
  // is worse than no menu.
  if (at.bottom < 0 || at.top > window.innerHeight) return closeCodecMenu()
  const menu = codecMenu.host
  menu.style.minWidth = `${at.width}px`
  const size = { width: menu.offsetWidth, height: menu.offsetHeight }
  const below = window.innerHeight - at.bottom
  const top = below >= size.height + 8 || below >= at.top ? at.bottom + 4 : at.top - size.height - 4
  menu.style.top = `${Math.max(8, Math.min(top, window.innerHeight - size.height - 8))}px`
  menu.style.left = `${Math.max(8, Math.min(at.left, window.innerWidth - size.width - 8))}px`
}
const openCodecMenu = (anchor, values, current, onPick) => {
  if (codecMenu.anchor === anchor) return closeCodecMenu()
  closeCodecMenu()
  const menu = el('div', 'cmenu')
  for (const value of values) {
    const on = value === current
    const row = el('button', `crow${on ? ' -on' : ''}`)
    row.type = 'button'
    // '' is a real choice — the platform's own pick — for a picker whose
    // codec is not in effect yet. Named, since a blank row reads as broken.
    row.innerHTML = `<span class="tick">${on ? '✓' : ''}</span>${esc(value ? value.toUpperCase() : 'Auto')}`
    row.onclick = () => {
      closeCodecMenu()
      if (!on) onPick(value)
    }
    menu.append(row)
  }
  document.body.append(menu)
  codecMenu.host = menu
  codecMenu.anchor = anchor
  // The menu floats outside the card's DOM, so the pointer crossing onto it
  // would drop the card's hover lift and visibly bob the card. Hold the card
  // in its lifted state for as long as its menu is open.
  codecMenu.card = anchor.closest('.card')
  codecMenu.card?.classList.add('menu-open')
  anchor.classList.add('-open')
  placeCodecMenu()
}
document.addEventListener('pointerdown', (event) => {
  if (!codecMenu.host) return
  if (codecMenu.host.contains(event.target) || codecMenu.anchor.contains(event.target)) return
  closeCodecMenu()
})
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeCodecMenu()
})
// Stay glued to the anchor while anything scrolls or the window resizes.
window.addEventListener('scroll', placeCodecMenu, true)
window.addEventListener('resize', placeCodecMenu)

// One toast for a fleet-wide switch: the per-bot outcomes, counted.
const codecOutcome = (results) => {
  const counts = {}
  for (const result of Object.values(results)) counts[result] = (counts[result] ?? 0) + 1
  const text = ['applied', 'default', 'requested', 'unavailable', 'unsupported', 'unknown']
    .filter((key) => counts[key])
    .map((key) => `${counts[key]} ${key}`)
    .join(', ')
  const ok = Object.values(results).every((r) => r === 'applied' || r === 'default')
  return { text: text || 'no bots', ok }
}

// A single-option picker has nothing "Auto" could mean — name the codec.
const resetAllCodecPickers = () => {
  for (const btn of document.querySelectorAll('[data-all-codec]')) {
    const list = CODEC_LISTS[btn.dataset.allCodec]
    const single = list.length === 1 ? list[0] : ''
    btn.dataset.value = single
    btn.textContent = single ? single.toUpperCase() : 'Auto'
  }
}
resetAllCodecPickers()

for (const btn of document.querySelectorAll('[data-all-codec]')) {
  const role = btn.dataset.allCodec
  btn.onclick = async () => {
    openCodecMenu(btn, CODEC_LISTS[role], btn.dataset.value ?? '', async (codec) => {
      btn.dataset.value = codec ?? ''
      btn.textContent = codec ? codec.toUpperCase() : 'Auto'
      btn.disabled = true
      try {
        const { results } = await post('/api/action', {
          slug: 'all', action: 'codec', value: { role, codec },
        })
        const { text, ok } = codecOutcome(results)
        toast(`${CODEC_WORD[role]} codec for all bots: ${text}`, ok ? '-ok' : '-warn')
      } catch (error) {
        toast(error.message, '-err')
      } finally {
        btn.disabled = false
      }
    })
  }
}

/* ---------- codecs the next send arrives with ---------- */
// Same seam as the CLI's --video-codec / --screen-codec: the choice rides
// /api/start and /api/add, so the bots negotiate it at the join instead of
// being switched afterwards. Bots already in the call are untouched — those
// are what the all-bots bar and the per-bot pickers are for.
const JOIN_ROLES = ['video', 'screen']
const joinCodecs = () =>
  capabilities().codecs
    ? Object.fromEntries(
        JOIN_ROLES.map((role) => [
          `${role}Codec`,
          $(`[data-join-codec="${role}"]`).dataset.value || null,
        ]),
      )
    : {}
const joinBox = $('#joinCodecs')
const joinToggle = $('#codecToggle')
// Shown, or holding a choice while hidden: either way the trigger says so.
const syncJoinToggle = () => {
  const pinned = Object.values(joinCodecs()).some(Boolean)
  joinToggle.classList.toggle('-on', pinned || !joinBox.hidden)
}
joinToggle.onclick = () => {
  joinBox.hidden = !joinBox.hidden
  joinToggle.setAttribute('aria-expanded', String(!joinBox.hidden))
  syncJoinToggle()
}
for (const btn of document.querySelectorAll('[data-join-codec]')) {
  const role = btn.dataset.joinCodec
  btn.dataset.value = ''
  btn.onclick = () => {
    // Auto leads: a bot that has not been sent yet has no codec in use to
    // fall back to reading, so the way back has to be on the list.
    openCodecMenu(btn, ['', ...CODEC_LISTS[role]], btn.dataset.value, (codec) => {
      btn.dataset.value = codec
      btn.textContent = codec ? codec.toUpperCase() : 'Auto'
      btn.classList.toggle('-forced', Boolean(codec))
      syncJoinToggle()
    })
  }
}

/* ---------- batches: the bots of one send, shown and removed together ---------- */
const clock = (at) =>
  new Date(at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })

const removeBatch = async (id, btn) => {
  btn.dataset.busy = '1'
  btn.disabled = true
  const label = btn.textContent
  btn.textContent = 'Removing…'
  try {
    await post('/api/action', { slug: `batch:${id}`, action: 'leave' })
  } catch (error) {
    toast(error.message, '-err')
  } finally {
    delete btn.dataset.busy
    btn.disabled = false
    btn.textContent = label
  }
}

const buildGroup = (batch) => {
  const group = el('div', 'batch')
  group.dataset.batch = batch.id
  group.innerHTML = `
    <div class="bhead">
      <span class="nm">Batch ${esc(batch.id)}</span>
      <span class="sub"></span>
      <span class="spacer"></span>
      <button class="btn -danger" data-batch-remove
        title="Remove every bot that came in with this batch">Remove batch</button>
    </div>
    <div class="grid"></div>
    <div class="bnote" hidden>every bot of this send is pinned above</div>`
  $('[data-batch-remove]', group).onclick = (event) => removeBatch(batch.id, event.currentTarget)
  return group
}

/* ---------- pinned bots: the ones you keep coming back to, kept on top ---------- */
// A pin is a view preference, not fleet state, so it lives in the panel — and
// it belongs to the session it was made in: bot slugs restart at bot-1 with
// the next call, and a leftover pin would grab an unrelated bot.
const PIN_STORAGE_KEY = 'call-bots-pins'
const savePins = () => {
  try {
    localStorage.setItem(
      PIN_STORAGE_KEY, JSON.stringify({ at: S.pinnedAt, slugs: [...S.pinned] }),
    )
  } catch { /* the pins still work for this page without storage */ }
}
// Reloading the panel mid-call must not lose them, so they are read back when
// the session is still the one they were made in — and dropped when it is not.
const syncPins = (startedAt) => {
  if (startedAt === S.pinnedAt) return
  S.pinnedAt = startedAt
  let saved = null
  try { saved = JSON.parse(localStorage.getItem(PIN_STORAGE_KEY) ?? 'null') }
  catch { /* unreadable storage reads the same as no pins */ }
  S.pinned = new Set(saved?.at === startedAt && Array.isArray(saved.slugs) ? saved.slugs : [])
}
const togglePin = (slug) => {
  if (!S.pinned.delete(slug)) S.pinned.add(slug)
  savePins()
  if (S.state) render(S.state)
}
$('#unpinAll').onclick = () => {
  S.pinned.clear()
  savePins()
  if (S.state) render(S.state)
}

// Cards move between the pinned section and their batch, so their order is
// settled here rather than by the append that created them. Only the ones out
// of place are re-inserted: moving a card that is already where it belongs
// would drop the pointer's hover and restart the card's transitions.
const placeCards = (grid, cards) => {
  let moved = false
  for (const [i, card] of cards.entries()) {
    if (grid.children[i] === card) continue
    grid.insertBefore(card, grid.children[i] ?? null)
    moved = true
  }
  // A card that moved carried an open codec menu's anchor with it.
  if (moved) placeCodecMenu()
}

/* ---------- bot cards ---------- */
const buildCard = (guest) => {
  const card = el('div', 'card')
  card.dataset.slug = guest.slug
  card.innerHTML = `
    <div class="strip" style="background:${esc(guest.color)}"></div>
    <div class="thumb">
      <div class="skeleton">connecting…</div>
      <img alt="" draggable="false" style="display:none">
      <span class="pill">–</span>
    </div>
    <div class="cbody">
      <div class="who">
        <div class="ava" style="background:${esc(guest.color)}">${esc(guest.label.trim().charAt(0).toUpperCase() || 'G')}</div>
        <div style="min-width:0">
          <div class="nm">${esc(guest.label)}</div>
        </div>
        <span class="gap"></span>
        <button class="ibtn -pin" data-pin aria-pressed="false"
          title="Pin to the top">${I.pin}</button>
      </div>
      <div class="controls">
        <button class="ibtn" data-act="mic" title="Toggle microphone">${I.mic}</button>
        <button class="ibtn" data-act="cam" title="Toggle camera">${I.cam}</button>
        <button class="ibtn" data-act="share" data-capability="screen" title="Share a screen">${I.share}</button>
        <button class="ibtn" data-rtc-toggle data-capability="rtc" title="Stream monitor">${I.pulse}</button>
        <span class="gap"></span>
        <button class="ibtn" data-act="leave" title="Remove this bot">${I.leave}</button>
      </div>
      <div class="rtcbar" hidden>
        <span class="qdot"></span>
        <span>↓ <b data-rtc="down">–</b></span>
        <span>↑ <b data-rtc="up">–</b></span>
        <span>RTT <b data-rtc="rtt">–</b></span>
      </div>
      <div class="rtcpanel" data-rtc-panel>
        <div class="rpath" data-rtc-path hidden></div>
        <div class="codecbar" data-codec-bar hidden></div>
        <div data-rtc-dyn></div>
      </div>
      <div class="cnote" data-note hidden></div>
      <div class="err"></div>
    </div>`
  for (const btn of card.querySelectorAll('[data-act]')) {
    btn.onclick = () => cardAction(guest.slug, btn.dataset.act, btn)
  }
  // Not a data-act: neither the monitor toggle nor the pin asks the server for
  // anything — they only change what this panel shows.
  $('[data-rtc-toggle]', card).onclick = () => toggleRtc(guest.slug, card)
  $('[data-pin]', card).onclick = () => togglePin(guest.slug)
  return card
}

const cardAction = async (slug, act, btn) => {
  const guest = (S.state?.session?.guests ?? []).find((g) => g.slug === slug)
  if (!guest) return
  let action = act
  if (act === 'mic') action = guest.mic === 'off' ? 'unmute' : 'mute'
  if (act === 'cam') action = guest.cam === 'off' ? 'cam-on' : 'cam-off'
  if (act === 'share') action = guest.screen === 'on' ? 'share-off' : 'share-on'
  btn.classList.add('busy')
  try {
    const { results } = await post('/api/action', { slug, action })
    const result = results[guest.label]
    if (result === 'request') toast(`${guest.label}: the host restricted this device`, '-warn')
    if (result === 'blocked') toast('This call blocks screen sharing — set Meeting settings, Screen share to Allowed. If it was On request, send the bots again.', '-warn')
  } catch (error) {
    toast(`${guest.label}: ${error.message}`, '-err')
  } finally {
    btn.classList.remove('busy')
  }
}

const STATE_LABEL = {
  created: 'queued', ready: 'left', joining: 'joining',
  'in-call': 'in call', leaving: 'leaving', closed: 'closed',
}
const updateCard = (guest, grid) => {
  let card = S.cards.get(guest.slug)
  if (!card) {
    card = buildCard(guest)
    S.cards.set(guest.slug, card)
  }
  // Pinning moves the card between grids; placeCards settles its order there.
  if (card.parentElement !== grid) grid.append(card)
  const pinned = S.pinned.has(guest.slug)
  card.classList.toggle('-pinned', pinned)
  const pin = $('[data-pin]', card)
  pin.classList.toggle('-on', pinned)
  pin.setAttribute('aria-pressed', String(pinned))
  pin.title = pinned ? 'Unpin — send it back to its batch' : 'Pin to the top'
  $('.who .nm', card).textContent = guest.label
  const failed = guest.state.startsWith('error')
  const base = failed ? 'error' : guest.state
  const pill = $('.thumb .pill', card)
  pill.textContent = failed ? 'error' : (STATE_LABEL[base] ?? base)
  pill.className = `pill -${base}`
  card.classList.toggle('has-error', Boolean(guest.lastError) && failed)
  const err = $('.err', card)
  err.textContent = guest.lastError ?? ''
  const note = $('[data-note]', card)
  note.hidden = !guest.note
  note.textContent = guest.note ?? ''

  const inCall = guest.state === 'in-call'
  const mic = $('[data-act=mic]', card)
  mic.innerHTML = guest.mic === 'off' ? I.micOff : I.mic
  mic.className = `ibtn${guest.mic === 'off' ? ' -off' : ''}${guest.mic === 'request' ? ' -req' : ''}${mic.classList.contains('busy') ? ' busy' : ''}`
  mic.disabled = !inCall

  const cam = $('[data-act=cam]', card)
  cam.innerHTML = guest.cam === 'off' ? I.camOff : I.cam
  cam.className = `ibtn${guest.cam === 'off' ? ' -off' : ''}${guest.cam === 'request' ? ' -req' : ''}${cam.classList.contains('busy') ? ' busy' : ''}`
  cam.disabled = !inCall

  const share = $('[data-act=share]', card)
  share.hidden = capabilities().screen === false
  share.className = `ibtn${guest.screen === 'on' ? ' -live' : ''}${guest.screen === 'blocked' ? ' -off' : ''}${share.classList.contains('busy') ? ' busy' : ''}`
  share.title = guest.screen === 'blocked'
    ? 'This call blocks screen sharing — set Meeting settings, Screen share to Allowed. If it was On request, send the bots again: the call does not lift that one for anyone already in it.'
    : 'Share a screen'
  share.disabled = !inCall || guest.screen === 'blocked'

  $('[data-act=leave]', card).disabled = ['created', 'closed'].includes(guest.state)

  const rtcSupported = capabilities().rtc !== false
  $('[data-rtc-toggle]', card).hidden = !rtcSupported
  if (rtcSupported) {
    updateRtcCard(guest, card)
  } else {
    $('.rtcbar', card).hidden = true
    $('[data-rtc-panel]', card).hidden = true
    card.classList.remove('rtc-open')
    const entry = S.rtc.get(guest.slug)
    if (entry?.timer) clearInterval(entry.timer)
    S.rtc.delete(guest.slug)
  }
}

/* ---------- per-bot stream monitor ---------- */
// The heavy lifting happens inside each bot's page (the injected monitor keeps
// a model of every stream it sends and receives). The card shows its 2s SSE
// summary at all times; opening the panel additionally polls /api/rtc/<slug>
// for the full per-stream model while it stays open.
const rtcEntry = (slug) => {
  let entry = S.rtc.get(slug)
  if (!entry) {
    entry = { open: false, timer: null, snap: null, inFlight: false }
    S.rtc.set(slug, entry)
  }
  return entry
}

// Thresholds copied from rtc-stream-monitor's quality(), so a bot reads the
// same here as it would in the overlay itself.
const rtcQuality = (s) => {
  if (!s || !s.pcs) return { word: 'no connection', tone: '' }
  if (s.via || s.rtt == null) return { word: 'connected', tone: 'ok' }
  const loss = s.loss ?? 0
  const jit = s.jit ?? 0
  if (s.rtt < 100 && loss < 0.5 && jit < 20) return { word: 'excellent', tone: 'ok' }
  if (s.rtt < 200 && loss < 2 && jit < 40) return { word: 'good', tone: 'ok' }
  if (s.rtt < 350 && loss < 5) return { word: 'fair', tone: 'warn' }
  return { word: 'poor', tone: 'danger' }
}

const fmtKbps = (k) => {
  if (k == null || !isFinite(k)) return '–'
  if (k >= 1000) return `${(k / 1000).toFixed(k >= 10000 ? 0 : 1)} Mbps`
  return `${Math.round(k)} kbps`
}
// The machine's own load, in the header: how much headroom is left for more
// bots, and whether a quality dip is the computer's fault. A chip stays
// hidden until its number exists (older server, first warming sample).
const chipTone = (chip, pct) => {
  chip.classList.toggle('-danger', pct != null && pct >= 92)
  chip.classList.toggle('-warn', pct != null && pct >= 80 && pct < 92)
}
const renderSystem = (system) => {
  const cpuChip = $('#sysCpu')
  const memChip = $('#sysMem')
  const netChip = $('#sysNet')
  const cpu = system?.cpu ?? null
  cpuChip.hidden = cpu == null
  if (cpu != null) {
    cpuChip.querySelector('b').textContent = `${cpu < 10 ? cpu.toFixed(1) : Math.round(cpu)}%`
    chipTone(cpuChip, cpu)
  }
  const mem = system?.mem ?? null
  memChip.hidden = !(mem?.total > 0 && mem?.avail != null)
  if (!memChip.hidden) {
    const used = Math.max(0, mem.total - mem.avail)
    // What is free is the headroom for more bots — the number this header
    // exists to keep in view — so it is shown, not left to be worked out.
    const [usedEl, freeEl] = memChip.querySelectorAll('b')
    usedEl.textContent = `${(used / 1024 ** 3).toFixed(1)} GB`
    freeEl.textContent = `${(mem.avail / 1024 ** 3).toFixed(1)} GB`
    chipTone(memChip, (used / mem.total) * 100)
  }
  const net = system?.net ?? null
  netChip.hidden = net == null
  if (net != null) {
    const [downEl, upEl] = netChip.querySelectorAll('b')
    downEl.textContent = fmtKbps(net.down)
    upEl.textContent = fmtKbps(net.up)
  }
}
const updateRtcCard = (guest, card) => {
  const inCall = guest.state === 'in-call'
  const entry = rtcEntry(guest.slug)
  const rtc = guest.rtc ?? null
  $('.rtcbar', card).hidden = !inCall
  $('[data-rtc=down]', card).textContent = fmtKbps(rtc?.down)
  $('[data-rtc=up]', card).textContent = fmtKbps(rtc?.up)
  $('[data-rtc=rtt]', card).textContent = rtc?.rtt == null ? '–' : `${Math.round(rtc.rtt)} ms`
  const q = rtcQuality(rtc)
  $('.qdot', card).className = `qdot${q.tone ? ` -${q.tone}` : ''}`
  const btn = $('[data-rtc-toggle]', card)
  // An open panel must stay closable after the bot drops out of the call.
  btn.disabled = !inCall && !entry.open
  btn.classList.toggle('-live', entry.open)
  if (entry.open) renderRtcPanel(guest, card)
}

const pollRtc = async (slug) => {
  const entry = S.rtc.get(slug)
  if (!entry || !entry.open || entry.inFlight) return
  entry.inFlight = true
  try {
    const res = await fetch(`/api/rtc/${encodeURIComponent(slug)}`)
    entry.snap = res.status === 200 ? await res.json() : null
  } catch {
    entry.snap = null
  }
  entry.inFlight = false
  const card = S.cards.get(slug)
  const guest = (S.state?.session?.guests ?? []).find((g) => g.slug === slug)
  if (entry.open && card && guest) renderRtcPanel(guest, card)
}

const toggleRtc = (slug, card) => {
  const entry = rtcEntry(slug)
  entry.open = !entry.open
  card.classList.toggle('rtc-open', entry.open)
  $('[data-rtc-toggle]', card).classList.toggle('-live', entry.open)
  if (entry.open) {
    pollRtc(slug)
    entry.timer = setInterval(() => pollRtc(slug), 2000)
    const guest = (S.state?.session?.guests ?? []).find((g) => g.slug === slug)
    if (guest) renderRtcPanel(guest, card)
  } else {
    clearInterval(entry.timer)
    entry.timer = null
    entry.snap = null
    // Only the rebuilt region: the codec bar keeps its selects (and their
    // options) for the next open, it just goes back into hiding.
    $('[data-rtc-dyn]', card).innerHTML = ''
    $('[data-codec-bar]', card).hidden = true
    $('[data-rtc-path]', card).hidden = true
  }
}


const streamRow = (s) => {
  const icon = s.kind === 'audio' ? I.mic : s.role === 'screen' ? I.share : I.cam
  // No name found in the bot's page: last 4 of the SSRC keeps rows tellable
  // apart instead of all reading "Video" (same fallback as the overlay).
  const name = s.name ?? `${s.kind === 'audio' ? 'Audio' : 'Video'}${s.ssrc ? ` · ${String(s.ssrc).slice(-4)}` : ''}`
  const meta = []
  if (s.codec?.name) meta.push(`<b>${esc(String(s.codec.name).toUpperCase())}</b>`)
  if (s.kind === 'video') {
    if (s.w && s.h) meta.push(`<b>${s.w}×${s.h}</b>`)
    if (s.fps != null && isFinite(s.fps)) meta.push(`<b>${Math.round(s.fps)}</b> fps`)
  } else if (s.codec?.clock) {
    meta.push(`<b>${s.codec.clock / 1000}</b> kHz`)
  }
  // One line per row and the middle truncates first — quality numbers live in
  // the aggregate tiles above. Rows keep only the outbound layer annotations
  // and the encoder-limitation flag.
  if (s.dir === 'out') {
    if (s.rid) meta.push(`layer <b>${esc(s.rid)}</b>`)
    else if (s.layer) meta.push(`layer <b>${s.layer}</b>`)
    if (s.idle) meta.push('idle')
    if (s.limit) meta.push(`⚠ ${esc(s.limit)}-limited`)
  }
  const level =
    s.kind === 'audio' && s.level != null
      ? `<span class="lvl"><i style="width:${Math.min(100, Math.round(Math.sqrt(Math.max(0, s.level)) * 100))}%"></i></span>`
      : ''
  const metaHtml = meta.join(' · ')
  // The row is one line and the middle truncates; the title carries what the
  // ellipsis swallowed.
  const metaText = metaHtml.replace(/<[^>]+>/gu, '')
  return `<div class="srow">${icon}<span class="nm" title="${esc(name)}">${esc(name)}</span>` +
    `<span class="meta" title="${metaText}">${metaHtml}</span>${level}<span class="rate">${fmtKbps(s.kbps)}</span></div>`
}

// No microphone picker: the platform publishes opus and nothing else, and a
// one-option dropdown is furniture. The audio role still exists API-side.
const CODEC_ROLES = [
  { role: 'video', word: 'Cam', kind: 'video' },
  { role: 'screen', word: 'Screen', kind: 'video' },
]

// What each role is sending right now, read from the same snapshot the stream
// rows are built from — so "auto" can say what auto currently means.
const liveCodecs = (snap) => {
  const live = { audio: null, video: null, screen: null }
  // Carrying streams first, so a dead leftover row can never lend its codec
  // to the picker.
  const rows = [...(snap?.outbound ?? [])].sort((a, b) => (b.kbps ?? 0) - (a.kbps ?? 0))
  for (const s of rows) {
    const name = s.codec?.name
    if (!name) continue
    const role = s.kind === 'audio' ? 'audio' : s.role === 'screen' ? 'screen' : 'video'
    live[role] ??= String(name).toLowerCase()
  }
  return live
}

// The selects live OUTSIDE the region the 2s poll rebuilds — an innerHTML
// pass would slam a dropdown shut under the pointer. Options come from what
// this bot's browser can send (the snapshot's caps) and are rebuilt only when
// that changes; values follow the server state unless the user is mid-pick.
const updateCodecBar = (guest, card, caps, live, negotiated) => {
  const bar = $('[data-codec-bar]', card)
  if (!caps) {
    bar.hidden = true
    return
  }
  // The choices ARE what a switch can land on: the call's negotiated set for
  // the role, narrowed to what this browser can send. While a role has no
  // live sender yet (a share not started) nothing is negotiated, so the
  // browser's own list stands in. Unavailable codecs are simply not offered.
  const options = {}
  for (const { role, kind } of CODEC_ROLES) {
    const avail = negotiated?.[role] ?? []
    options[role] = sortCodecs(
      avail.length ? (caps[kind] ?? []).filter((name) => avail.includes(name)) : caps[kind] ?? [],
    )
  }
  const sig = JSON.stringify(options)
  if (bar.dataset.caps !== sig) {
    // Never rebuild under the pointer or under an open menu; the next poll
    // catches up.
    if (bar.contains(document.activeElement) || bar.contains(codecMenu.anchor)) return
    bar.dataset.caps = sig
    bar.innerHTML = ''
    for (const { role, word } of CODEC_ROLES) {
      const group = el('div', 'cgrp')
      const caption = el('span', 'ck', esc(word))
      caption.dataset.codecLive = role
      const btn = el('button', 'codec', 'Auto')
      btn.type = 'button'
      btn.dataset.codecRole = role
      btn.title = `${CODEC_WORD[role][0].toUpperCase()}${CODEC_WORD[role].slice(1)} send codec`
      btn.onclick = () => {
        // The button already reads the codec in effect; tick that row.
        const current = btn.textContent === 'Auto' ? '' : btn.textContent.toLowerCase()
        openCodecMenu(btn, options[role], current, (codec) =>
          setBotCodec(guest.slug, role, codec, btn))
      }
      group.append(caption, btn)
      bar.append(group)
    }
  }
  bar.hidden = false
  // The picker shows the codec in effect: the forced one when pinned, else
  // the codec really going out — "Auto" only while nothing is known (a share
  // not started). The accent border is what marks a pin.
  for (const btn of bar.querySelectorAll('[data-codec-role]')) {
    if (btn === codecMenu.anchor || btn.dataset.busy) continue
    const role = btn.dataset.codecRole
    const forced = guest.codecs?.[role] ?? ''
    // With exactly one possible codec there is nothing "Auto" could mean —
    // name it (a muted mic on Aloqa still speaks opus when it speaks).
    const only = options[role].length === 1 ? options[role][0] : ''
    const effective = forced || live?.[role] || only
    btn.textContent = effective ? effective.toUpperCase() : 'Auto'
    btn.classList.toggle('-forced', Boolean(forced))
  }
}

const setBotCodec = async (slug, role, codec, btn) => {
  const guest = (S.state?.session?.guests ?? []).find((g) => g.slug === slug)
  const label = guest?.label ?? slug
  btn.dataset.busy = '1'
  btn.disabled = true
  btn.textContent = codec ? codec.toUpperCase() : 'Auto'
  btn.classList.toggle('-forced', Boolean(codec))
  try {
    const { results } = await post('/api/action', { slug, action: 'codec', value: { role, codec } })
    const result = results[label] ?? Object.values(results)[0]
    if (result === 'applied') toast(`${label}: ${CODEC_WORD[role]} codec is now ${codec}`, '-ok')
    else if (result === 'default') toast(`${label}: ${CODEC_WORD[role]} codec back to auto — the call decides from here`, '-ok')
    else if (result === 'unsupported') toast(`${label}: this browser cannot send ${codec}`, '-warn')
    else if (result === 'unavailable') toast(`${label}: this call does not negotiate ${codec} — nothing to switch to`, '-warn')
    else toast(`${label}: ${CODEC_WORD[role]} codec requested — the stream rows show what the call took`, '-warn')
  } catch (error) {
    toast(`${label}: ${error.message}`, '-err')
  } finally {
    delete btn.dataset.busy
    btn.disabled = false
  }
}

// How the media actually gets out, worded as the monitor itself words it (see
// src/vendor/rtc-stream-monitor.js): the local candidate type is the whole
// story — a relay means every packet is taking a detour through a TURN server.
const PATH_WORD = { relay: 'via TURN relay', host: 'direct · LAN' }
const connPath = (d) => {
  const local = d?.localCand
  if (!local?.type) return null
  const via = PATH_WORD[local.type] ?? 'direct · STUN'
  return {
    text: local.proto ? `${via} · ${String(local.proto).toUpperCase()}` : via,
    // The monitor's own transport line, kept for the hover: the candidate
    // types on both ends, the network behind the local one, and DTLS.
    detail: [
      `local ${local.type}${local.net ? ` (${local.net})` : ''}`,
      d.remoteCand?.type ? `remote ${d.remoteCand.type}` : null,
      d.dtls ? `DTLS ${d.dtls}` : null,
    ].filter(Boolean).join(' · '),
  }
}

const renderRtcPanel = (guest, card) => {
  const dyn = $('[data-rtc-dyn]', card)
  const pathEl = $('[data-rtc-path]', card)
  if (guest.state !== 'in-call') {
    $('[data-codec-bar]', card).hidden = true
    pathEl.hidden = true
    dyn.innerHTML = '<div class="rmsg">waiting for the call…</div>'
    return
  }
  const entry = rtcEntry(guest.slug)
  const d = entry.snap
  const path = connPath(d)
  pathEl.hidden = !path
  if (path) {
    pathEl.textContent = path.text
    pathEl.title = path.detail
  }
  updateCodecBar(guest, card, d?.caps ?? null, liveCodecs(d), d?.negotiated ?? null)
  // The compact bar on the card already carries rates and RTT; the panel is
  // codecs and streams only.
  let html = ''
  if (!d) {
    html += '<div class="rmsg">loading streams…</div>'
  } else {
    // Dead weight out, idle layers in: a 0 kbps outgoing row earns its place
    // only as the paused sibling of a track that is otherwise alive (an
    // SFU-paused simulcast or SVC layer). A row whose whole track carries
    // nothing is a leftover publication — codec churn and backup publications
    // shed those — not a stream anyone is sending.
    const sending = d.outbound.filter((s) => {
      if (s.kbps !== 0) return true
      if (!s.track) return false
      return d.outbound.some(
        (o) => o !== s && o.kind === s.kind && o.track === s.track && (o.kbps ?? 0) > 0,
      )
    })
    // Simulcast without rids: streams sharing a track are encodings of one
    // source — number them, and say the quiet ones are idle, not broken.
    for (const s of sending) {
      if (s.kind !== 'video' || !s.track) continue
      const sibs = sending.filter((o) => o.kind === 'video' && o.track === s.track)
      if (sibs.length > 1) {
        if (!s.rid) s.layer = `${sibs.indexOf(s) + 1}/${sibs.length}`
        if (!s.kbps) s.idle = true
      }
    }
    html += `<div class="lbl">Sending · ${sending.length}</div>` +
      (sending.map(streamRow).join('') || '<div class="rmsg">no outgoing streams</div>')
    // A subscription carrying nothing — a muted mic, a paused SFU layer — is
    // noise in a receiving list. 0 kbps is measured-inactive and hidden; null
    // is merely not-measured-yet (first tick) and stays.
    const receiving = d.inbound.filter((s) => s.kbps !== 0)
    html += `<div class="lbl">Receiving · ${receiving.length}</div>` +
      (receiving.map(streamRow).join('') || '<div class="rmsg">no incoming streams</div>')
    if (d.limit) {
      html += `<div class="rwarn">${
        d.limit === 'cpu'
          ? 'CPU-limited encoder — the machine cannot keep up with the configured quality'
          : 'bandwidth-limited encoder — the network cannot carry the configured quality'
      }</div>`
    }
  }
  dyn.innerHTML = html
}

/* ---------- thumbnails ---------- */
const refreshThumbs = () => {
  const guests = S.state?.session?.guests ?? []
  guests.forEach((guest, i) => {
    if (['created', 'closed'].includes(guest.state)) return
    const card = S.cards.get(guest.slug)
    if (!card) return
    setTimeout(() => {
      const img = $('.thumb img', card)
      const probe = new Image()
      probe.onload = () => {
        img.src = probe.src
        img.style.display = 'block'
        $('.thumb .skeleton', card).style.display = 'none'
      }
      probe.src = `/api/thumb/${encodeURIComponent(guest.slug)}?t=${Date.now()}`
    }, i * 250)
  })
}

/* ---------- render ---------- */
const render = (state) => {
  S.state = state
  const running = state.status === 'running'
  const joining = state.status === 'joining'
  const busy = joining || state.status === 'stopping'

  const pill = $('#statusPill')
  pill.textContent = state.status
  pill.className = `pill -${state.status}`
  renderSystem(state.system)

  // A session mid-join is already a session to stop: one bot stuck in an
  // admission lobby holds "joining" for up to ten minutes, and hiding Stop for
  // all of it leaves the window with no way out.
  $('#stopBtn').hidden = !running && !joining
  $('#allbar').hidden = !running
  // A fleet-wide pick belongs to the fleet it was made for: when the session
  // is gone, the pickers go back to their defaults instead of advertising a
  // stale choice to the next batch.
  if (!running) resetAllCodecPickers()
  $('#goBtn').textContent = running ? 'Add bots' : 'Send bots'
  $('#goBtn').disabled = busy
  // the link belongs to the live call, so it is fixed for the session
  $('#link').disabled = running || busy
  if (running && state.session?.inviteLink) $('#link').value = state.session.inviteLink

  if (state.lastError && state.lastError !== S.errorShown) {
    S.errorShown = state.lastError
    toast(state.lastError, '-err')
  }
  if (!state.lastError) S.errorShown = null

  // Meet says its own piece; everything else is about the bundled Chromium.
  const selected = platformId()
  if (selected === 'meet') {
    showMeetEmptyState(joining)
  } else if (state.browserInstalling) {
    $('#emptyTitle').textContent = 'Getting the browser ready'
    $('#emptyText').textContent = state.browserProgress
      ? `Downloading Chromium — ${state.browserProgress}. Bots can join as soon as it lands.`
      : 'Downloading Chromium (one-time, about 175 MB). Bots can join as soon as it lands.'
    $('#goBtn').disabled = true
  } else if (!state.browserReady) {
    $('#emptyTitle').textContent = 'No browser available'
    $('#emptyText').textContent = 'Install Google Chrome, or run: npx playwright install chromium'
  } else {
    $('#emptyTitle').textContent = 'No bots in a call yet'
    $('#emptyText').textContent = 'Paste the call link, choose how many bots, and send them in.'
  }

  syncPlatformUi()

  const guests = state.session?.guests ?? []
  const batches = state.session?.batches ?? []
  $('#empty').hidden = guests.length > 0
  const awaiting = guests.filter((guest) => guest.waitingAdmission)
  if (selected === 'meet' && awaiting.length > 0) {
    const notice = `${state.startedAt}:${awaiting.map((guest) => guest.slug).join(',')}`
    if (notice !== S.admissionNotice) {
      S.admissionNotice = notice
      toast(`${awaiting.length} Google Meet ${awaiting.length === 1 ? 'bot is' : 'bots are'} awaiting admission.`, '-warn')
    }
  } else {
    S.admissionNotice = null
  }
  syncPins(state.startedAt)

  // A pinned bot leaves its batch grid for the section above every batch —
  // reaching the bot you keep working with is the whole point, and scrolling
  // for it is what a pin is against. It keeps its place in the roster order.
  const pinnedGroup = $('#pinned')
  const pinnedGrid = $('.grid', pinnedGroup)
  const pinned = guests.filter((guest) => S.pinned.has(guest.slug))
  pinnedGroup.hidden = pinned.length === 0
  $('.bhead .sub', pinnedGroup).textContent = `${pinned.length} bot${pinned.length === 1 ? '' : 's'}`
  for (const guest of pinned) updateCard(guest, pinnedGrid)
  placeCards(pinnedGrid, pinned.map((guest) => S.cards.get(guest.slug)))

  for (const batch of batches) {
    let group = S.groups.get(batch.id)
    if (!group) {
      group = buildGroup(batch)
      S.groups.set(batch.id, group)
      // Batch ids only ever grow, so appending keeps the groups in the order
      // they were sent — and leaves the ones already on screen where they are.
      $('#cards').append(group)
    }
    const mine = guests.filter((guest) => guest.batch === batch.id)
    // The count stays the batch's own: a pinned bot is shown elsewhere, it did
    // not leave the send it arrived in, and Remove batch still takes it out.
    $('.bhead .sub', group).textContent =
      `${mine.length} bot${mine.length === 1 ? '' : 's'} · sent ${clock(batch.at)}`
    // Removing a batch takes as long as closing its browsers; a snapshot
    // arriving meanwhile must not hand the button back mid-request.
    const remove = $('[data-batch-remove]', group)
    if (!remove.dataset.busy) remove.disabled = !running
    const here = mine.filter((guest) => !S.pinned.has(guest.slug))
    const grid = $('.grid', group)
    for (const guest of here) updateCard(guest, grid)
    placeCards(grid, here.map((guest) => S.cards.get(guest.slug)))
    // Pinning every bot of a send would otherwise leave a heading over a gap.
    $('.bnote', group).hidden = here.length > 0
  }
  for (const [id, group] of S.groups) {
    if (!batches.some((batch) => batch.id === id)) {
      group.remove()
      S.groups.delete(id)
    }
  }
  let unpinned = false
  for (const [slug, card] of S.cards) {
    if (!guests.some((guest) => guest.slug === slug)) {
      card.remove()
      S.cards.delete(slug)
      // A bot that is gone takes its pin with it, or it would come back to
      // haunt the next bot handed the same slug.
      if (S.pinned.delete(slug)) unpinned = true
      // The card takes its stream-monitor state with it — a poll timer must
      // not outlive the bot it polls for.
      const entry = S.rtc.get(slug)
      if (entry?.timer) clearInterval(entry.timer)
      S.rtc.delete(slug)
    }
  }
  if (unpinned) savePins()
}

/* ---------- live updates ---------- */
const connect = () => {
  const es = new EventSource('/api/events')
  es.onopen = () => document.body.classList.remove('disconnected')
  es.onerror = () => document.body.classList.add('disconnected')
  es.onmessage = (event) => {
    const msg = JSON.parse(event.data)
    if (msg.type === 'state') render(msg.state)
  }
}
connect()
setInterval(refreshThumbs, 3000)
</script>
</body>
</html>
